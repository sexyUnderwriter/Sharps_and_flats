<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 816 1056" version="1.1">
  <style>
      .page { fill: #f4f0e7; }
      .card { fill: #fffdf9; stroke: #202b33; stroke-width: 1.3; }
      .title { fill: #fff; font-family: Georgia, serif; font-weight: 700; letter-spacing: 0; }
      .notation, .meter { fill: #202b33; font-family: Georgia, serif; font-weight: 700; }
      .staff, .tie { fill: none; stroke: #202b33; stroke-width: 2.3; stroke-linecap: round; }
      .note { fill: #202b33; }
      .divider { stroke: #d5d0c5; stroke-width: 1; }
      .rule { fill: #36424b; font-family: Helvetica, sans-serif; }
    </style>
  <rect x="0" y="0" width="816" height="1056" class="page" />
  <g transform="translate(52,42)">
    <rect x="0" y="0" width="224" height="314" rx="10" ry="10" class="card" />
    <rect x="0" y="0" width="224" height="46" rx="10" ry="10" fill="#c65b28" />
    <text x="112.0" y="30" font-size="16" text-anchor="middle" class="title">REPEAT PHRASE</text>
    <text x="112.0" y="125" font-size="42" text-anchor="middle" class="notation">||:  :||</text>
    <line x1="18" y1="184" x2="206" y2="184" class="divider" />
    <text x="112.0" y="210" font-size="10" text-anchor="middle" class="rule">Place after a completed phrase.</text>
    <text x="112.0" y="225" font-size="10" text-anchor="middle" class="rule">Play the entire phrase before</text>
    <text x="112.0" y="240" font-size="10" text-anchor="middle" class="rule">this card one additional time,</text>
    <text x="112.0" y="255" font-size="10" text-anchor="middle" class="rule">in the same order.</text>
  </g>
  <g transform="translate(296,42)">
    <rect x="0" y="0" width="224" height="314" rx="10" ry="10" class="card" />
    <rect x="0" y="0" width="224" height="46" rx="10" ry="10" fill="#c65b28" />
    <text x="112.0" y="30" font-size="16" text-anchor="middle" class="title">TIE</text>
    <line x1="54" y1="124" x2="168" y2="124" class="staff" />
    <ellipse cx="65" cy="124" rx="8" ry="6" class="note" />
    <ellipse cx="157" cy="124" rx="8" ry="6" class="note" />
    <path d="M 72 118 Q 111 88 150 118" class="tie" />
    <line x1="18" y1="184" x2="206" y2="184" class="divider" />
    <text x="112.0" y="210" font-size="10" text-anchor="middle" class="rule">Place between cards when the</text>
    <text x="112.0" y="225" font-size="10" text-anchor="middle" class="rule">final note on the left and</text>
    <text x="112.0" y="240" font-size="10" text-anchor="middle" class="rule">first note on the right are the</text>
    <text x="112.0" y="255" font-size="10" text-anchor="middle" class="rule">same pitch. Sustain it across</text>
    <text x="112.0" y="270" font-size="10" text-anchor="middle" class="rule">the boundary.</text>
  </g>
